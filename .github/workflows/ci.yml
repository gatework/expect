name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - run: make check
      - name: Archive checked source
        if: github.ref == 'refs/heads/main' && matrix.go == '1.27.x'
        shell: bash
        run: |
          mkdir dist
          git archive --format=tar --prefix=expect/ "$GITHUB_SHA" | gzip -n > dist/expect-source.tar.gz
          cd dist
          sha256sum expect-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && matrix.go == '1.27.x'
        with:
          name: source-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
